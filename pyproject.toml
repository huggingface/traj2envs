[project]
name = "traj2envs"
version = "0.1.0"
description = "Turn ATIF agent trajectories into validated Harbor RL tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["huggingface_hub>=0.30", "pyarrow>=15", "pydantic>=2", "tomli-w>=1.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]  # needed by the qa and build families
dev = ["pytest>=8"]

[project.scripts]
traj2envs = "traj2envs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["traj2envs"]
